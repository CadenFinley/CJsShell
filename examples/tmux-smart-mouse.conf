# Restore cjsh smart mouse capture when tmux finishes selecting text.
# Keep existing copy bindings (including clipboard plugins). Only notify a cjsh
# prompt that has released capture while retaining SGR release-event encoding.
set-hook -g 'pane-mode-changed[1006]' {
    if-shell -F '#{&&:#{==:#{pane_current_command},cjsh},#{&&:#{!:#{pane_in_mode}},#{&&:#{mouse_sgr_flag},#{!:#{mouse_any_flag}}}}}' {
        send-keys -H 1b 5b 3c 30 3b 30 3b 30 6d
    }
}
